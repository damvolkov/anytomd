[build-system]
requires = ["maturin>=1.15.0"]
build-backend = "maturin"

[project]
name = "anytomd"
version = "1.4.2"
description = "Python binding of anytomd-rs: DOCX, PPTX, XLSX, HTML, CSV, images and more to clean Markdown for LLMs."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "EDamLabs" }]
keywords = ["markdown", "document", "conversion", "docx", "pptx", "xlsx", "html", "llm", "rag", "rust", "anytomd-rs"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]

[project.optional-dependencies]
ocr = ["liteparse>=2.16"]
pdf = ["liteparse>=2.16"]
vlm = ["openai>=3.31", "pydantic-settings>=2.11"]
full = ["anytomd[ocr,pdf,vlm]"]

[project.urls]
Homepage = "https://github.com/edamlabs/anytomd"
Documentation = "https://edamlabs.github.io/anytomd/"
Source = "https://github.com/edamlabs/anytomd"
Issues = "https://github.com/edamlabs/anytomd/issues"
Upstream = "https://github.com/developer0hye/anytomd-rs"

[dependency-groups]
lint = [
    "ruff>=0.17.2",
    "ty>=0.0.92",
    "tach>=0.35.3",
    "validate-pyproject[all]>=0.27",
    "zizmor>=1.31.1",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
    "hypothesis>=6.170.11",
    "liteparse>=2.17.0",
    "openai>=3.37.0",
    "pydantic-settings>=2.16.1",
]
build = [
    "maturin>=1.15.0",
]
docs = [
    "zensical>=0.0.72,<0.1",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "build" },
    { include-group = "docs" },
    "prek>=0.5.7",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "crates/**/*.rs" }]

[tool.maturin]
manifest-path = "crates/native/Cargo.toml"
module-name = "anytomd._native"
python-source = "src"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
exclude = ["tests/resources"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG", "FBT"]
"tests/conftest.py" = ["S310"]
"tools/*.py" = ["S310"]

[tool.ruff.lint.isort]
known-first-party = ["anytomd", "tests"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["format"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "tools"]
exclude = ["tests/resources"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "-m", "not stress and not integration"]
pythonpath = ["."]
strict = true
filterwarnings = ["error"]
timeout = "60"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: slow tests (deselect with -m 'not slow')",
    "stress: concurrency and volume stress (run via make stress)",
    "integration: third-party LLM provider calls (run via make integration)",
]

[tool.coverage.run]
source_pkgs = ["anytomd"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "@overload"]
