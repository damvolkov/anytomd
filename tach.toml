#  ┌──────────────────────────────────────────────────────────────────────────┐
#  │  tach · architectural import contracts (Rust-backed)                       │
#  │  bootstrap: `tach mod` → `tach sync` · CI: `tach check` (make arch)         │
#  └──────────────────────────────────────────────────────────────────────────┘

source_roots = ["src"]

exclude = ["tests", "docs"]

forbid_circular_dependencies = true

exact = true

root_module = "forbid"

[rules]
unused_ignore_directives = "error"

[[modules]]
path = "anytomd"
depends_on = ["anytomd._native"]

[[modules]]
path = "anytomd._native"
depends_on = []
