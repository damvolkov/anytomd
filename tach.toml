#  ┌──────────────────────────────────────────────────────────────────────────┐
#  │  tach · architectural import contracts (Rust-backed)                       │
#  │  bootstrap: `tach mod` → `tach sync` · CI: `tach check` (make arch)         │
#  └──────────────────────────────────────────────────────────────────────────┘

source_roots = ["src"]

exclude = ["tests", "docs"]

forbid_circular_dependencies = true

exact = true

root_module = "forbid"

[rules]
unused_ignore_directives = "error"

[[modules]]
path = "anytomd"
depends_on = ["anytomd._native", "anytomd.converters", "anytomd.describers", "anytomd.documents", "anytomd.errors"]

[[modules]]
path = "anytomd._capabilities"
depends_on = []

[[modules]]
path = "anytomd._native"
depends_on = []

[[modules]]
path = "anytomd.describers"
depends_on = ["anytomd._capabilities"]

[[modules]]
path = "anytomd.converters"
depends_on = ["anytomd._capabilities", "anytomd.documents", "anytomd.errors"]

[[modules]]
path = "anytomd.documents"
depends_on = []

[[modules]]
path = "anytomd.errors"
depends_on = ["anytomd._native"]
