site_name: anytomd
site_description: Python binding of anytomd-rs — any document to clean Markdown, built for LLMs.
site_url: https://damvolkov.github.io/anytomd/
repo_name: damvolkov/anytomd
repo_url: https://github.com/damvolkov/anytomd
edit_uri: edit/main/docs/
copyright: Apache-2.0 · binding &copy; 2026 damvolkov · engine &copy; developer0hye

theme:
  name: material
  icon:
    logo: material/language-markdown
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Light mode }
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.sections
    - content.code.copy
    - content.code.annotate
    - search.share

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/damvolkov/anytomd
    - icon: fontawesome/brands/rust
      link: https://github.com/developer0hye/anytomd-rs

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true, line_spans: __span }
  - pymdownx.snippets: { check_paths: true }

plugins:
  - search

nav:
  - Home: index.md
  - Formats: formats.md
  - API: api.md
  - Errors: errors.md
  - Project:
      - Upstream and versioning: upstream.md
      - Self-maintenance: maintenance.md
      - Development: development.md
      - Changelog: changelog.md
