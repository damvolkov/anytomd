[workspace]
resolver = "3"
members = ["crates/native"]

[workspace.package]
version = "1.3.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/damvolkov/anytomd"

[workspace.dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312", "experimental-async"] }
anytomd = { version = "=1.3.1", features = ["async-gemini"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
